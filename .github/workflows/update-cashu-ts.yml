name: Update cashu-ts submodule

on:
  schedule:
    # daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update cashu-ts submodule to latest origin/main
        id: update
        run: |
          set -euo pipefail
          echo "Syncing submodule config"
          git submodule sync --recursive
          # Ensure submodule exists
          if [ ! -d cashu-ts ]; then
            echo "Submodule folder cashu-ts not found"
            exit 1
          fi

          # Fetch origin in the submodule and ensure origin/main exists
          git -C cashu-ts fetch --prune origin
          if ! git -C cashu-ts show-ref --verify --quiet refs/remotes/origin/main; then
            echo "origin/main not found for cashu-ts. Nothing to do."
            echo "updated=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Checkout origin/main in detached head so submodule pointer moves to that commit
          git -C cashu-ts checkout --detach origin/main

          # Stage submodule change and check for diff
          git add cashu-ts
          if git diff --staged --quiet; then
            echo "No submodule update detected"
            echo "updated=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          git commit -m "chore(deps): update cashu-ts submodule to origin/main"
          echo "updated=true" >> $GITHUB_OUTPUT

      - name: Create pull request if updated
        id: create_pr
        if: steps.update.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update cashu-ts submodule to latest"
          branch: chore/update-cashu-ts
          title: "chore(deps): update cashu-ts submodule"
          body: |
            This PR was created automatically by a workflow to update the `cashu-ts` submodule to the latest state of its default branch.

            If you want Renovate-style grouped dependency PRs, consider enabling Renovate and adding a `.github/renovate.json` (example included in this repo).
          labels: |
            automated
            dependencies

      - name: Enable auto-merge for the PR
        if: steps.update.outputs.updated == 'true'
        uses: peter-evans/enable-pull-request-automerge@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Use the pull request number returned by the create-pull-request action
          pull-request-number: ${{ steps.create_pr.outputs.pull-request-number }}
          # merge-method can be merge, squash, or rebase — choose what matches your branch protection
          merge-method: merge
